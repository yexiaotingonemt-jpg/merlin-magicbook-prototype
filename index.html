}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );

    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

  padding: 5px;

  background: transparent !important;

  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);

  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;

a:is(:hover, :focus-visible) {

  text-decoration-style: dashed;

h2,
h3,
h4,
h5,

  line-height: 1.25;
}

h3,
h4,
h5,

  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {

}

code:not(pre code) {

}

}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {

}

.table :is(caption, thead th) {

}

.table thead th {

}

}

}

  gap: 12px;
  width: 100%;
  padding: 0;

.card {

  padding: 12px;

  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {

  top: 0;
  left: 0;
  width: max-content;

    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)

  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);

.viz-grid {

  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));

}

  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {

}

.text-muted {

}

.sr-only {

  height: 1px;

}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {

  opacity: 0.6;
}

.form-check-label {

.form-switch .form-check-input {

  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {

  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;

  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));

  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);

  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);

.form-switch .form-check-input:checked {
  background: var(--primary);

.form-switch .form-check-input:checked::before {

.form-range::-moz-range-track {

      const kinds = [
        { id: &#x27;normal&#x27;, label: &#x27;普通事件&#x27;, hp: 58, score: 100 },
        { id: &#x27;normal&#x27;, label: &#x27;普通事件&#x27;, hp: 64, score: 110 },
        { id: &#x27;attack&#x27;, label: &#x27;攻击增幅&#x27;, hp: 74, score: 130 },
        { id: &#x27;convert&#x27;, label: &#x27;转化牌事件&#x27;, hp: 68, score: 120 },
        { id: &#x27;trapped&#x27;, label: &#x27;困住棋子&#x27;, hp: 82, score: 145 },
        { id: &#x27;healing&#x27;, label: &#x27;治疗事件&#x27;, hp: 62, score: 115 }
      ];
      const cardPool = [
        { name: &#x27;净化·风&#x27;, faction: &#x27;angel&#x27;, mode: &#x27;purify&#x27;, range: &#x27;single&#x27;, element: &#x27;wind&#x27;, attack: 40, cost: 10, desc: &#x27;将目标转化为风，检查共鸣&#x27; },
        { name: &#x27;净化·雷&#x27;, faction: &#x27;angel&#x27;, mode: &#x27;purify&#x27;, range: &#x27;single&#x27;, element: &#x27;thunder&#x27;, attack: 42, cost: 10, desc: &#x27;将目标转化为雷，检查共鸣&#x27; },
        { name: &#x27;净化·火&#x27;, faction: &#x27;angel&#x27;, mode: &#x27;purify&#x27;, range: &#x27;single&#x27;, element: &#x27;fire&#x27;, attack: 44, cost: 10, desc: &#x27;将目标转化为火，检查共鸣&#x27; },
        { name: &#x27;净化·电&#x27;, faction: &#x27;angel&#x27;, mode: &#x27;purify&#x27;, range: &#x27;single&#x27;, element: &#x27;electric&#x27;, attack: 41, cost: 10, desc: &#x27;将目标转化为电，检查共鸣&#x27; },
        { name: &#x27;摧毁&#x27;, faction: &#x27;demon&#x27;, mode: &#x27;destroy&#x27;, range: &#x27;single&#x27;, attack: 52, cost: 10, desc: &#x27;对指定目标造成直接伤害&#x27; },
        { name: &#x27;横向摧毁&#x27;, faction: &#x27;demon&#x27;, mode: &#x27;destroy&#x27;, range: &#x27;row&#x27;, attack: 30, cost: 10, desc: &#x27;对目标所在横排造成伤害&#x27; },
        { name: &#x27;纵向摧毁&#x27;, faction: &#x27;demon&#x27;, mode: &#x27;destroy&#x27;, range: &#x27;column&#x27;, attack: 34, cost: 10, desc: &#x27;对目标所在竖排造成伤害&#x27; }
      ];
      const state = {
        score: 0,
        stamina: 150,
        light: 0,
        dark: 0,
        tendency: 0,
        form: null,
        boosted: false,
        projection: 0,
        permanentAttack: 0,
        conversion: 1,
        convertMode: false,
        selectedCard: null,
        hand: [],
        board: [],
        preview: [],
        logs: [],
        projectionElement: &#x27;wind&#x27;,
        projectionTargetIndex: 0,
        angelMark: null,
        abyssMark: null,
        projectionBoard: []
      };

      function randomOf(list) {
        return list[Math.floor(Math.random() * list.length)];
      }

      function makeEvent(forceElement) {
        const kind = randomOf(kinds);
        return {
          id: Math.random().toString(36).slice(2),
          element: forceElement || randomOf(elements),
          kind: kind.id,
          kindLabel: kind.label,
          hp: kind.hp,
          maxHp: kind.hp,
          score: kind.score,
          claimed: false
        };
      }

      function drawCard(excludeName) {
        const candidates = cardPool.filter(function (card) { return card.name !== excludeName; });
        return Object.assign({}, randomOf(candidates), { uid: Math.random().toString(36).slice(2) });
      }

      function addLog(text, tone) {
        state.logs.unshift({ text: text, tone: tone || &#x27;&#x27; });
        state.logs = state.logs.slice(0, 5);
      }

      function init() {
        const seeded = [
          &#x27;wind&#x27;, &#x27;fire&#x27;, &#x27;thunder&#x27;, &#x27;electric&#x27;,
          &#x27;fire&#x27;, &#x27;electric&#x27;, &#x27;wind&#x27;, &#x27;thunder&#x27;,
          &#x27;wind&#x27;, &#x27;wind&#x27;, &#x27;fire&#x27;, &#x27;electric&#x27;
        ];
        state.board = seeded.map(function (el) { return makeEvent(el); });
        state.preview = [makeEvent(), makeEvent(), makeEvent(), makeEvent()];
        state.hand = [
          Object.assign({}, cardPool[0], { uid: &#x27;start-1&#x27; }),
          Object.assign({}, cardPool[4], { uid: &#x27;start-2&#x27; }),
          Object.assign({}, cardPool[2], { uid: &#x27;start-3&#x27; })
        ];
        state.projectionBoard = [makeEvent(&#x27;wind&#x27;), makeEvent(&#x27;fire&#x27;), makeEvent(&#x27;wind&#x27;), makeEvent(&#x27;electric&#x27;)];
        addLog(&#x27;选择手牌开始行动；同阵营连续出牌可加速变身。&#x27;);
        render();
      }

      function finalAttack(card) {
        let value = card.attack + state.permanentAttack;
        if (state.form === &#x27;demon&#x27;) value *= state.boosted ? 1.2 : 1.1;
        return Math.round(value);
      }

      function factionLabel(faction) {
        return faction === &#x27;angel&#x27; ? &#x27;☀ 天使属性&#x27; : &#x27;☾ 恶魔属性&#x27;;
      }

      function formBonusText() {
        if (state.form === &#x27;angel&#x27;) return &#x27;个人积分 +&#x27; + (state.boosted ? &#x27;10%&#x27; : &#x27;5%&#x27;);
        if (state.form === &#x27;demon&#x27;) return &#x27;全部攻击力 +&#x27; + (state.boosted ? &#x27;20%&#x27; : &#x27;10%&#x27;);
        return &#x27;无形态加成&#x27;;
      }

      function renderMeters() {
        $(&#x27;mp-score&#x27;).textContent = Math.round(state.score).toLocaleString(&#x27;zh-CN&#x27;);
        $(&#x27;mp-stamina&#x27;).textContent = &#x27;体力 &#x27; + state.stamina + &#x27; / 150&#x27;;
        $(&#x27;mp-light-value&#x27;).textContent = Math.floor(state.light) + &#x27; / 100&#x27;;
        $(&#x27;mp-dark-value&#x27;).textContent = Math.floor(state.dark) + &#x27; / 100&#x27;;
        $(&#x27;mp-light-fill&#x27;).style.width = Math.min(100, state.light) + &#x27;%&#x27;;
        $(&#x27;mp-dark-fill&#x27;).style.width = Math.min(100, state.dark) + &#x27;%&#x27;;
        $(&#x27;mp-form-name&#x27;).textContent = state.form === &#x27;angel&#x27; ? &#x27;天使形态&#x27; : state.form === &#x27;demon&#x27; ? &#x27;恶魔形态&#x27; : &#x27;中立形态&#x27;;
        $(&#x27;mp-form-bonus&#x27;).textContent = formBonusText();
        const pips = $(&#x27;mp-pips&#x27;);
        pips.innerHTML = &#x27;&#x27;;
        for (let i = 1; i &lt;= 5; i += 1) {
          const pip = document.createElement(&#x27;span&#x27;);
          pip.className = &#x27;merlin-pip&#x27;;
          if (state.tendency &gt; 0 &amp;&amp; i &lt;= state.tendency) pip.classList.add(&#x27;is-light&#x27;);
          if (state.tendency &lt; 0 &amp;&amp; i &lt;= Math.abs(state.tendency)) pip.classList.add(&#x27;is-dark&#x27;);
          pips.appendChild(pip);
        }
        const base = 40 + state.permanentAttack;
        const shown = state.form === &#x27;demon&#x27; ? Math.round(base * (state.boosted ? 1.2 : 1.1)) : base;
        $(&#x27;mp-attack&#x27;).textContent = &#x27;全部攻击力 &#x27; + shown + (state.permanentAttack ? &#x27;（活动成长 +&#x27; + state.permanentAttack + &#x27;）&#x27; : &#x27;&#x27;);
        $(&#x27;mp-convert-count&#x27;).textContent = &#x27;转化牌 &#x27; + state.conversion + &#x27; / 3&#x27;;
        $(&#x27;mp-projection-count&#x27;).textContent = &#x27;机会 &#x27; + state.projection;
      }

      function eventMarkup(event, index, compact) {
        const meta = elementMeta[event.element];
        const hpPct = Math.max(0, event.hp / event.maxHp * 100);
        const front = !compact &amp;&amp; index &gt;= 8 ? &#x27; is-front&#x27; : &#x27;&#x27;;
        const targetable = !compact &amp;&amp; state.selectedCard !== null ? &#x27; is-targetable&#x27; : &#x27;&#x27;;
        return &#x27;&lt;button type=&quot;button&quot; class=&quot;merlin-event element-&#x27; + event.element + front + targetable + &#x27;&quot; data-event-index=&quot;&#x27; + index + &#x27;&quot; role=&quot;gridcell&quot; aria-label=&quot;&#x27; +
          meta.label + &#x27;，&#x27; + event.kindLabel + &#x27;，生命&#x27; + Math.max(0, event.hp) + &#x27;&quot;&gt;&#x27; +
          &#x27;&lt;span class=&quot;merlin-event-top&quot;&gt;&lt;span class=&quot;merlin-element &#x27; + event.element + &#x27;&quot;&gt;&#x27; + meta.icon + &#x27; &#x27; + meta.label + &#x27;&lt;/span&gt;&lt;span class=&quot;merlin-kind&quot;&gt;&#x27; + event.kindLabel + &#x27;&lt;/span&gt;&lt;/span&gt;&#x27; +
          &#x27;&lt;span class=&quot;merlin-hp&quot;&gt;&lt;span style=&quot;width:&#x27; + hpPct + &#x27;%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&#x27; +
          &#x27;&lt;span class=&quot;merlin-event-bottom&quot;&gt;&lt;span&gt;生命 &#x27; + Math.max(0, event.hp) + &#x27;&lt;/span&gt;&lt;span&gt;&#x27; + event.score + &#x27;分&lt;/span&gt;&lt;/span&gt;&#x27; +
          &#x27;&lt;/button&gt;&#x27;;
      }

      function renderBoard() {
        $(&#x27;mp-preview&#x27;).innerHTML = state.preview.map(function (event) {
          const meta = elementMeta[event.element];
          return &#x27;&lt;div class=&quot;merlin-preview-item element-&#x27; + event.element + &#x27;&quot;&gt;&lt;span class=&quot;merlin-element &#x27; + event.element + &#x27;&quot;&gt;&#x27; + meta.icon + &#x27; &#x27; + meta.label + &#x27;&lt;/span&gt; · &#x27; + event.kindLabel + &#x27;&lt;/div&gt;&#x27;;
        }).join(&#x27;&#x27;);
        $(&#x27;mp-board&#x27;).innerHTML = state.board.map(function (event, index) {
          return eventMarkup(event, index, false);
        }).join(&#x27;&#x27;);
        root.querySelectorAll(&#x27;[data-event-index]&#x27;).forEach(function (button) {
          button.addEventListener(&#x27;click&#x27;, function () {
            playCard(Number(button.getAttribute(&#x27;data-event-index&#x27;)));
          });
        });
      }

      function renderHand() {
        $(&#x27;mp-hand&#x27;).innerHTML = state.hand.map(function (card, index) {
          const selected = state.selectedCard === index ? &#x27; is-selected&#x27; : &#x27;&#x27;;
          const convertTarget = state.convertMode ? &#x27; is-convert-target&#x27; : &#x27;&#x27;;
          const factionClass = card.faction === &#x27;angel&#x27; ? &#x27;angel&#x27; : &#x27;demon&#x27;;
          const powerLabel = card.mode === &#x27;purify&#x27; ? &#x27;共鸣攻击 &#x27; : &#x27;直接伤害 &#x27;;
          return &#x27;&lt;button type=&quot;button&quot; class=&quot;merlin-card faction-&#x27; + card.faction + selected + convertTarget + &#x27;&quot; data-card-index=&quot;&#x27; + index + &#x27;&quot;&gt;&#x27; +
            &#x27;&lt;span class=&quot;merlin-card-faction&quot;&gt;&lt;span class=&quot;&#x27; + factionClass + &#x27;&quot;&gt;&#x27; + factionLabel(card.faction) + &#x27;&lt;/span&gt;&lt;span&gt;体力 &#x27; + card.cost + &#x27;&lt;/span&gt;&lt;/span&gt;&#x27; +
            &#x27;&lt;div class=&quot;merlin-card-name&quot;&gt;&#x27; + card.name + &#x27;&lt;/div&gt;&#x27; +
            &#x27;&lt;div class=&quot;merlin-card-desc&quot;&gt;&#x27; + card.desc + &#x27;&lt;/div&gt;&#x27; +
            &#x27;&lt;div class=&quot;merlin-card-power&quot;&gt;&#x27; + powerLabel + &#x27;&lt;strong&gt;&#x27; + finalAttack(card) + &#x27;&lt;/strong&gt;&lt;/div&gt;&#x27; +
            &#x27;&lt;/button&gt;&#x27;;
        }).join(&#x27;&#x27;);
        root.querySelectorAll(&#x27;[data-card-index]&#x27;).forEach(function (button) {
          button.addEventListener(&#x27;click&#x27;, function () {
            const index = Number(button.getAttribute(&#x27;data-card-index&#x27;));
            if (state.convertMode) {
              transformCard(index);
            } else {
              state.selectedCard = state.selectedCard === index ? null : index;
              $(&#x27;mp-instruction&#x27;).textContent = state.selectedCard === null ? &#x27;选择一张手牌，再选择棋盘目标。&#x27; : &#x27;已选择“&#x27; + state.hand[index].name + &#x27;”，请选择棋盘目标。&#x27;;
              renderBoard();
              renderHand();
            }
          });
        });
        $(&#x27;mp-convert&#x27;).disabled = state.conversion &lt;= 0;
        $(&#x27;mp-convert&#x27;).textContent = state.convertMode ? &#x27;取消转化&#x27; : &#x27;使用转化牌&#x27;;
      }

      function renderProjection() {
        const panel = $(&#x27;mp-projection&#x27;);
        if (!state.form) {
          panel.innerHTML = &#x27;&lt;p class=&quot;merlin-projection-empty&quot;&gt;光明值或黑暗值达到100后激活形态，并获得一次投影机会。&lt;/p&gt;&#x27;;
          return;
        }
        const angel = state.form === &#x27;angel&#x27;;
        const targets = angel ? [&#x27;艾琳 · 活跃&#x27;, &#x27;洛莎 · 活跃&#x27;] : [&#x27;诺克斯 · 活跃&#x27;, &#x27;卡戎 · 活跃&#x27;];
        let html = &#x27;&lt;div class=&quot;merlin-target-switch&quot;&gt;&#x27;;
        targets.forEach(function (name, index) {
          html += &#x27;&lt;button type=&quot;button&quot; class=&quot;merlin-choice&quot; data-target-switch=&quot;&#x27; + index + &#x27;&quot; aria-pressed=&quot;&#x27; + (state.projectionTargetIndex === index) + &#x27;&quot;&gt;&#x27; + name + &#x27;&lt;/button&gt;&#x27;;
        });
        html += &#x27;&lt;/div&gt;&#x27;;
        if (state.projection &lt;= 0 &amp;&amp; state.angelMark === null &amp;&amp; state.abyssMark === null) {
          html += &#x27;&lt;p class=&quot;merlin-projection-empty&quot;&gt;当前没有投影机会。同形态再临会再次获得机会。&lt;/p&gt;&#x27;;
          panel.innerHTML = html;
          bindProjection();
          return;
        }
        if (angel) {
          html += &#x27;&lt;p class=&quot;merlin-subtle&quot;&gt;选择魔法类型，再选择友方第一排事件。目标与圣印对友方可见。&lt;/p&gt;&#x27;;
          html += &#x27;&lt;div class=&quot;merlin-element-choice&quot;&gt;&#x27;;
          elements.forEach(function (el) {
            html += &#x27;&lt;button type=&quot;button&quot; class=&quot;merlin-choice&quot; data-projection-element=&quot;&#x27; + el + &#x27;&quot; aria-pressed=&quot;&#x27; + (state.projectionElement === el) + &#x27;&quot;&gt;&#x27; + elementMeta[el].icon + &#x27; &#x27; + elementMeta[el].label + &#x27;&lt;/button&gt;&#x27;;
          });
          html += &#x27;&lt;/div&gt;&#x27;;
        } else {
          html += &#x27;&lt;p class=&quot;merlin-subtle&quot;&gt;选择敌方第一排事件生成深渊眷属；敌方只收到技能提示，看不到目标。&lt;/p&gt;&#x27;;
        }
        html += &#x27;&lt;div class=&quot;merlin-target-row&quot;&gt;&#x27;;
        state.projectionBoard.forEach(function (event, index) {
          const meta = elementMeta[event.element];
          const marked = state.angelMark === index ? &#x27; is-marked&#x27; : &#x27;&#x27;;
          const abyss = state.abyssMark === index ? &#x27; is-abyss&#x27; : &#x27;&#x27;;
          html += &#x27;&lt;button type=&quot;button&quot; class=&quot;merlin-target-event element-&#x27; + event.element + marked + abyss + &#x27;&quot; data-projection-event=&quot;&#x27; + index + &#x27;&quot;&gt;&#x27; +
            &#x27;&lt;span class=&quot;merlin-element &#x27; + event.element + &#x27;&quot;&gt;&#x27; + meta.icon + &#x27; &#x27; + meta.label + &#x27;&lt;/span&gt;&lt;br&gt;&#x27; +
            &#x27;&lt;span class=&quot;merlin-kind&quot;&gt;&#x27; + (abyss ? &#x27;深渊眷属（敌方隐藏）&#x27; : marked ? &#x27;圣印目标（公开）&#x27; : &#x27;普通事件&#x27;) + &#x27;&lt;/span&gt;&lt;br&gt;&#x27; +
            &#x27;&lt;span class=&quot;merlin-subtle&quot;&gt;生命 &#x27; + event.hp + &#x27;&lt;/span&gt;&lt;/button&gt;&#x27;;
        });
        html += &#x27;&lt;/div&gt;&#x27;;
        if (state.angelMark !== null) {
          html += &#x27;&lt;div class=&quot;merlin-resolution&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;merlin-action primary&quot; id=&quot;mp-friend-action&quot;&gt;模拟友方后续形成共鸣&lt;/button&gt;&lt;/div&gt;&#x27;;
        }
        if (state.abyssMark !== null) {
          html += &#x27;&lt;div class=&quot;merlin-resolution&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;merlin-action primary&quot; id=&quot;mp-direct-resolution&quot;&gt;敌方用直接伤害击杀&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;merlin-action&quot; id=&quot;mp-resonance-resolution&quot;&gt;敌方用共鸣消除&lt;/button&gt;&lt;/div&gt;&#x27;;
        }
        panel.innerHTML = html;
        bindProjection();
      }

      function bindProjection() {
        root.querySelectorAll(&#x27;[data-target-switch]&#x27;).forEach(function (button) {
          button.addEventListener(&#x27;click&#x27;, function () {
            state.projectionTargetIndex = Number(button.getAttribute(&#x27;data-target-switch&#x27;));
            state.projectionBoard = [makeEvent(), makeEvent(), makeEvent(), makeEvent()];
            state.angelMark = null;
            state.abyssMark = null;
            renderProjection();
          });
        });
        root.querySelectorAll(&#x27;[data-projection-element]&#x27;).forEach(function (button) {
          button.addEventListener(&#x27;click&#x27;, function () {
            state.projectionElement = button.getAttribute(&#x27;data-projection-element&#x27;);
            renderProjection();
          });
        });
        root.querySelectorAll(&#x27;[data-projection-event]&#x27;).forEach(function (button) {
          button.addEventListener(&#x27;click&#x27;, function () {
            useProjection(Number(button.getAttribute(&#x27;data-projection-event&#x27;)));
          });
        });
        const friendAction = $(&#x27;mp-friend-action&#x27;);
        if (friendAction) friendAction.addEventListener(&#x27;click&#x27;, resolveAngelTask);
        const direct = $(&#x27;mp-direct-resolution&#x27;);
        if (direct) direct.addEventListener(&#x27;click&#x27;, function () { resolveDemonTask(true); });
        const resonance = $(&#x27;mp-resonance-resolution&#x27;);
        if (resonance) resonance.addEventListener(&#x27;click&#x27;, function () { resolveDemonTask(false); });
      }

      function renderLogs() {
        $(&#x27;mp-log&#x27;).innerHTML = state.logs.map(function (entry) {
          return &#x27;&lt;div class=&quot;&#x27; + entry.tone + &#x27;&quot;&gt;&#x27; + entry.text + &#x27;&lt;/div&gt;&#x27;;
        }).join(&#x27;&#x27;);
      }

      function render() {
        renderMeters();
        renderBoard();
        renderHand();
        renderProjection();
        renderLogs();
      }

      function updateProgress(card) {
        const s = card.cost;
        if (card.faction === &#x27;angel&#x27;) {
          state.tendency = Math.min(5, state.tendency + 1);
          state.light += s + (state.tendency &gt; 0 ? s : 0);
        } else {
          state.tendency = Math.max(-5, state.tendency - 1);
          state.dark += s + (state.tendency &lt; 0 ? s : 0);
        }
        if (state.form === &#x27;angel&#x27; &amp;&amp; state.tendency &lt;= 0) {
          state.form = null;
          state.boosted = false;
          addLog(&#x27;光明倾向降至0，天使形态消失。&#x27;, &#x27;bad&#x27;);
        }
        if (state.form === &#x27;demon&#x27; &amp;&amp; state.tendency &gt;= 0) {
          state.form = null;
          state.boosted = false;
          addLog(&#x27;黑暗倾向降至0，恶魔形态消失。&#x27;, &#x27;bad&#x27;);
        }
        if (state.light &gt;= 100 &amp;&amp; state.tendency &gt; 0) activateForm(&#x27;angel&#x27;);
        if (state.dark &gt;= 100 &amp;&amp; state.tendency &lt; 0) activateForm(&#x27;demon&#x27;);
      }

      function activateForm(form) {
        if (form === &#x27;angel&#x27;) state.light -= 100;
        else state.dark -= 100;
        const same = state.form === form;
        state.form = form;
        state.tendency = form === &#x27;angel&#x27; ? 5 : -5;
        if (!same) state.boosted = false;
        state.projection += 1;
        state.angelMark = null;
        state.abyssMark = null;
        state.projectionBoard = form === &#x27;angel&#x27;
          ? [makeEvent(&#x27;wind&#x27;), makeEvent(&#x27;fire&#x27;), makeEvent(&#x27;wind&#x27;), makeEvent(&#x27;electric&#x27;)]
          : [makeEvent(), makeEvent(), makeEvent(), makeEvent()];
        addLog((same ? &#x27;同形态再临：&#x27; : &#x27;形态激活：&#x27;) + (form === &#x27;angel&#x27; ? &#x27;天使，积分立即 +&#x27; + (state.boosted ? &#x27;10%&#x27; : &#x27;5%&#x27;) : &#x27;恶魔，全部攻击力立即 +&#x27; + (state.boosted ? &#x27;20%&#x27; : &#x27;10%&#x27;)) + &#x27;。&#x27;, &#x27;good&#x27;);
      }

      function directTargets(index, range) {
        const row = Math.floor(index / 4);
        const col = index % 4;
        if (range === &#x27;row&#x27;) return [row * 4, row * 4 + 1, row * 4 + 2, row * 4 + 3];
        if (range === &#x27;column&#x27;) return [col, col + 4, col + 8];
        return [index];
      }

      function neighbors(index) {
        const row = Math.floor(index / 4);
        const col = index % 4;
        const list = [];
        if (row &gt; 0) list.push(index - 4);
        if (row &lt; 2) list.push(index + 4);
        if (col &gt; 0) list.push(index - 1);
        if (col &lt; 3) list.push(index + 1);
        return list;
      }

      function connectedGroup(start) {
        const element = state.board[start].element;
        const seen = new Set([start]);
        const queue = [start];
        while (queue.length) {
          const current = queue.shift();
          neighbors(current).forEach(function (next) {
            if (!seen.has(next) &amp;&amp; state.board[next].element === element) {
              seen.add(next);
              queue.push(next);
            }
          });
        }
        return Array.from(seen);
      }

      function resonance(card, changed) {
        const resolved = new Set();
        let totalHits = 0;
        changed.forEach(function (index) {
          if (resolved.has(index)) return;
          const group = connectedGroup(index);
          group.forEach(function (member) { resolved.add(member); });
          if (group.length &lt; 3) return;
          const scale = group.length &gt;= 6 ? 1.6 : group.length === 5 ? 1.4 : group.length === 4 ? 1.2 : 1;
          const damage = Math.round(finalAttack(card) * scale);
          group.forEach(function (member) {
            state.board[member].hp -= damage;
            totalHits += 1;
          });
          addLog(elementMeta[state.board[index].element].label + &#x27;共鸣：&#x27; + group.length + &#x27;个事件，每个受到&#x27; + damage + &#x27;点伤害。&#x27;, &#x27;good&#x27;);
        });
        return totalHits;
      }

      function rewardEvent(event) {
        const multiplier = state.form === &#x27;angel&#x27; ? (state.boosted ? 1.1 : 1.05) : 1;
        state.score += event.score * multiplier;
        if (event.kind === &#x27;attack&#x27;) {
          state.permanentAttack += 5;
          addLog(&#x27;攻击增幅事件消除：本次活动全部攻击力永久 +5。&#x27;, &#x27;good&#x27;);
        }
        if (event.kind === &#x27;convert&#x27; &amp;&amp; !event.claimed) {
          state.conversion = Math.min(3, state.conversion + 1);
          addLog(&#x27;转化牌事件消除：获得1张转化牌。&#x27;, &#x27;good&#x27;);
        }
      }

      function refillBoard() {
        for (let col = 0; col &lt; 4; col += 1) {
          const survivors = [];
          for (let row = 2; row &gt;= 0; row -= 1) {
            const event = state.board[row * 4 + col];
            if (event.hp &gt; 0) survivors.push(event);
            else rewardEvent(event);
          }
          while (survivors.length &lt; 3) {
            const next = state.preview.shift() || makeEvent();
            survivors.push(next);
            state.preview.push(makeEvent());
          }
          for (let row = 2; row &gt;= 0; row -= 1) {
            state.board[row * 4 + col] = survivors[2 - row];
          }
        }
      }

      function playCard(index) {
        if (state.selectedCard === null) {
          $(&#x27;mp-instruction&#x27;).textContent = &#x27;请先选择一张手牌。&#x27;;
          return;
        }
        const handIndex = state.selectedCard;
        const card = state.hand[handIndex];
        if (state.stamina &lt; card.cost) {
          addLog(&#x27;体力不足，无法继续出牌。&#x27;, &#x27;bad&#x27;);
          renderLogs();
          return;
        }
        if (card.mode === &#x27;purify&#x27;) {
          state.board[index].element = card.element;
          resonance(card, [index]);
          addLog(card.name + &#x27;生效：属性变更不检查攻击力。&#x27;);
        } else {
          const targets = directTargets(index, card.range);
          const damage = finalAttack(card);
          targets.forEach(function (targetIndex) {
            const event = state.board[targetIndex];
            event.hp -= damage;
            if (event.kind === &#x27;convert&#x27; &amp;&amp; !event.claimed &amp;&amp; damage &gt; 0) {
              event.claimed = true;
              state.conversion = Math.min(3, state.conversion + 1);
              addLog(&#x27;直接攻击转化牌事件：立即获得1张转化牌。&#x27;, &#x27;good&#x27;);
            }
          });
          addLog(card.name + &#x27;造成&#x27; + damage + &#x27;点直接伤害。&#x27;);
        }
        state.stamina -= card.cost;
        updateProgress(card);
        refillBoard();
        state.hand[handIndex] = drawCard(card.name);
        state.selectedCard = null;
        state.convertMode = false;
        $(&#x27;mp-instruction&#x27;).textContent = &#x27;已摸取1张新牌。继续选择手牌和目标。&#x27;;
        render();
      }

      function transformCard(index) {
        if (state.conversion &lt;= 0) return;
        const oldName = state.hand[index].name;
        state.hand[index] = drawCard(oldName);
        state.conversion -= 1;
        state.convertMode = false;
        state.selectedCard = null;
        addLog(&#x27;转化牌：&#x27; + oldName + &#x27;随机变为&#x27; + state.hand[index].name + &#x27;。&#x27;);
        render();
      }

      function useProjection(index) {
        if (state.projection &lt;= 0) return;
        state.projection -= 1;
        if (state.form === &#x27;angel&#x27;) {
          state.projectionBoard[index].element = state.projectionElement;
          const sameCount = state.projectionBoard.filter(function (event) { return event.element === state.projectionElement; }).length;
          if (sameCount &gt;= 3) {
            state.boosted = true;
            addLog(&#x27;天使投影立即形成共鸣：任务成功，积分加成翻倍。&#x27;, &#x27;good&#x27;);
            state.angelMark = null;
          } else {
            state.angelMark = index;
            addLog(&#x27;天使投影已公开：圣印等待友方后续形成共鸣。&#x27;);
          }
        } else {
          state.abyssMark = index;
          state.projectionBoard[index].hp = Math.round(state.projectionBoard[index].hp * 1.3);
          addLog(&#x27;恶魔投影已施放：敌方收到提示，但看不到深渊目标。&#x27;, &#x27;bad&#x27;);
        }
        render();
      }

      function resolveAngelTask() {
        if (state.angelMark === null) return;
        const element = state.projectionBoard[state.angelMark].element;
        state.projectionBoard.forEach(function (event) { event.element = element; });
        state.boosted = true;
        state.angelMark = null;
        addLog(&#x27;友方让圣印事件参与共鸣：天使任务成功，积分加成翻倍。&#x27;, &#x27;good&#x27;);
        render();
      }

      function resolveDemonTask(direct) {
        if (state.abyssMark === null) return;
        if (direct) {
          state.boosted = true;
          addLog(&#x27;深渊眷属被直接伤害击杀：恶魔任务成功，全部攻击力加成翻倍。&#x27;, &#x27;good&#x27;);
        } else {
          addLog(&#x27;深渊眷属被共鸣消除：恶魔任务失败，保留基础攻击加成。&#x27;, &#x27;bad&#x27;);
        }
        state.abyssMark = null;
        render();
      }

      $(&#x27;mp-convert&#x27;).addEventListener(&#x27;click&#x27;, function () {
        if (state.conversion &lt;= 0) return;
        state.convertMode = !state.convertMode;
        state.selectedCard = null;
        $(&#x27;mp-instruction&#x27;).textContent = state.convertMode ? &#x27;请选择要随机转化的手牌；不消耗体力且不占手牌。&#x27; : &#x27;选择一张手牌，再选择棋盘目标。&#x27;;
        renderHand();
        renderBoard();
      });

      $(&#x27;mp-demo-form&#x27;).addEventListener(&#x27;click&#x27;, function () {
        const faction = state.selectedCard !== null ? state.hand[state.selectedCard].faction : (state.tendency &lt; 0 ? &#x27;demon&#x27; : &#x27;angel&#x27;);
        if (faction === &#x27;angel&#x27;) {
          state.light = 100;
          state.tendency = Math.max(1, state.tendency);
          activateForm(&#x27;angel&#x27;);
        } else {
          state.dark = 100;
          state.tendency = Math.min(-1, state.tendency);
          activateForm(&#x27;demon&#x27;);
        }
        addLog(&#x27;原型演示：已补满当前阵营值，不扣除体力。&#x27;);
        render();
      });

      init();
    }());
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {

    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
